[package]
name = "tatamicam"
version = "1.0.0"
description = "TatamiCam - Judo Replay System"
authors = ["Renan Sena"]
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
sysinfo = "0.39.6"
jsonwebtoken = "9"

# Linux (WebKitGTK): usado para habilitar media stream e conceder a permissão de
# câmera no webview (getUserMedia é negado por padrão no Tauri/Linux). Versão fixada
# para casar com a que o wry já usa.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
